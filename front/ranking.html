        .rank-2 .podium-avatar { border-color: #C0C0C0; color: #C0C0C0; }
        .rank-2 .podium-bar { height: 100px; background: linear-gradient(to bottom, #E0E0E0, #C0C0C0); }
        .rank-1 .podium-avatar { border-color: #FFD700; color: #FFD700; width: 75px; height: 75px; font-size: 28px; }
        .rank-1 .podium-bar { height: 140px; background: linear-gradient(to bottom, #FFE066, #FFD700); }
        .rank-1 .crown { position: absolute; top: -22px; color: #FFD700; font-size: 20px; }

<body>
    <canvas id="bg-canvas"></canvas>
    <div class="app-container">
        <aside class="sidebar">
            <div class="logo">OPUS</div>
            <nav class="menu">
                <a href="dashboard.php" class="nav-link"><i class="fa-solid fa-chart-line"></i> Progresso</a>
                <a href="conquistas.php" class="nav-link"><i class="fa-solid fa-award"></i> Conquistas</a>
                <a href="ranking.html" class="nav-link active"><i class="fa-solid fa-ranking-star"></i> Ranking</a>
                <a href="perfil.php" class="nav-link"><i class="fa-solid fa-user"></i> Perfil</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="stats">
                    <div class="stat-box difficulty"><i class="fa-solid fa-fire"></i> <span id="top-diff">...</span> <small>Dificuldade</small></div>
                    <div class="stat-box trophies"><i class="fa-solid fa-trophy"></i> <span id="top-trophies">...</span> <small>Troféus</small></div>
                    <div class="stat-box xp"><i class="fa-solid fa-star"></i> <span id="top-xp">...</span> <small>Total XP</small></div>
                </div>
                <div class="user-info">
                    <span id="top-name">...</span>
                    <img src="opi.png" alt="Avatar" class="avatar">
                </div>
            </header>

            <div class="ranking-container">
                <div class="ranking-header">
                    <h1>Ranking Global</h1>
                    <p>Suba de nível resolvendo lições e garanta seu lugar no pódio!</p>
                </div>
                <div id="my-status" class="my-status-alert"></div>
                <div id="podium-container" class="podium"></div>
                <div id="ranking-list" class="ranking-list"></div>
            </div>
        </main>
    </div>
    
    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Aponta corretamente para a pasta back/
            fetch('../back/api_ranking.php')
                .then(response => response.json())
                .then(data => {
                    if (data.error === "unauthorized") { window.location.href = "auth.html"; return; }
                    
                    document.getElementById('top-diff').innerText = data.user_info.dificuldade || 'Iniciante';
                    document.getElementById('top-trophies').innerText = data.user_info.trofeus || '0';
                    document.getElementById('top-xp').innerText = Number(data.user_info.xp).toLocaleString('pt-BR');
                    document.getElementById('top-name').innerText = data.user_info.nome || 'Usuário';

                    if (data.minha_posicao > 0) {
                        const statusDiv = document.getElementById('my-status');
                        statusDiv.innerText = `Você está atualmente na ${data.minha_posicao}ª posição!`;
                        statusDiv.style.display = 'block';
                    }

                    let podiumHTML = '';
                    if (data.top3[1]) podiumHTML += `<div class="podium-item rank-2"><div class="podium-avatar"><i class="fa-solid fa-user"></i></div><div class="podium-name">${data.top3[1].nome}</div><div class="podium-xp">${Number(data.top3[1].xp).toLocaleString('pt-BR')} XP</div><div class="podium-bar">2</div></div>`;
                    if (data.top3[0]) podiumHTML += `<div class="podium-item rank-1"><div class="podium-avatar"><i class="fa-solid fa-crown crown"></i><i class="fa-solid fa-user"></i></div><div class="podium-name">${data.top3[0].nome}</div><div class="podium-xp">${Number(data.top3[0].xp).toLocaleString('pt-BR')} XP</div><div class="podium-bar">1</div></div>`;
                    if (data.top3[2]) podiumHTML += `<div class="podium-item rank-3"><div class="podium-avatar"><i class="fa-solid fa-user"></i></div><div class="podium-name">${data.top3[2].nome}</div><div class="podium-xp">${Number(data.top3[2].xp).toLocaleString('pt-BR')} XP</div><div class="podium-bar">3</div></div>`;
                    document.getElementById('podium-container').innerHTML = podiumHTML;

                    let listHTML = '';
                    data.lista_resto.forEach(user => {
                        listHTML += `<div class="ranking-row ${user.is_me ? 'is-me' : ''}"><div class="row-pos">${user.posicao}º</div><div class="row-avatar"><i class="fa-solid fa-user"></i></div><div class="row-name">${user.nome}${user.is_me ? ' (Você)' : ''}</div><div class="row-xp">${Number(user.xp).toLocaleString('pt-BR')} XP</div></div>`;
                    });
                    document.getElementById('ranking-list').innerHTML = listHTML;
                })
                .catch(err => console.error("Erro:", err));
        });
    </script>
</body>
