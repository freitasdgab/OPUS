<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesse o Opus</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="img/logo.png">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <link rel="stylesheet" href="intro.css"> 
    <link rel="stylesheet" href="auth.css">
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="opi-corner">
        <img src="img/opi pulando feliz.png" alt="Opi" class="opi-mini-img">
    </div>

    <div class="auth-container">
        <h2 class="auth-title">
            FAÇA LOGIN OU ENTRE NA SUA CONTA PARA CONTINUAR APRENDENDO PROGRAMAÇÃO DE FORMA DIVERTIDA E INTERATIVA.
        </h2>

        <form action="../back/auth.php" method="POST" id="authForm">
            <input type="hidden" name="action" id="authAction" value="cadastro">

            <div class="card-input">
                <div class="input-group" id="group-nome">
                    <label for="nome"><i class="fa-solid fa-user"></i> NOME:</label>
                    <div class="input-with-icon">
                        <input type="text" id="nome" name="nome" placeholder="Seu nome completo" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="email"><i class="fa-solid fa-envelope"></i> EMAIL:</label>
                    <div class="input-with-icon">
                        <input type="email" id="email" name="email" required placeholder="seuemail@exemplo.com">
                    </div>
                </div>

                <div class="input-group" id="group-senha">
                    <label for="senha"><i class="fa-solid fa-lock"></i> SENHA:</label>
                    <div class="input-with-icon">
                        <input type="password" id="senha" name="senha" required placeholder="******">
                        <button type="button" class="toggle-password" onclick="togglePasswordVisibility('senha', this)">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                    <div class="strength-bar-container" id="strength-container" style="display: none;">
                        <div id="strength-bar" class="strength-bar"></div>
                        <span id="strength-text" class="strength-text">Senha fraca</span>
                    </div>
                </div>

                <div class="input-group" id="group-confirmar">
                    <label for="confirme_senha"><i class="fa-solid fa-shield-halved"></i> CONFIRME A SENHA:</label>
                    <div class="input-with-icon">
                        <input type="password" id="confirme_senha" name="confirme_senha" placeholder="******" required>
                        <button type="button" class="toggle-password" onclick="togglePasswordVisibility('confirme_senha', this)">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                        
                    </div>
                </div>
                
            </div>

            <div id="password-requirements" class="password-requirements" style="display: block;">
                
             
                
            </div>

            <div class="buttons-group">
                <button type="button" class="btn-auth secondary" id="btnModoLogin">LOGAR</button>
                <button type="submit" class="btn-auth primary" id="btnSubmit">CADASTRAR-SE</button>
            </div>
        </form>
    </div>

    <script src="auth.js"></script>
    <script>
        function togglePasswordVisibility(inputId, button) {
            const input = document.getElementById(inputId);
            const icon = button.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }
    </script>
</body>
</html>
