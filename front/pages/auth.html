<body>

    <div class="main-wrapper">

        <div class="auth-container">

                FAÇA LOGIN OU ENTRE NA SUA CONTA PARA CONTINUAR APRENDENDO PROGRAMAÇÃO DE FORMA DIVERTIDA E INTERATIVA.
            </h2>

            <form action="../../back/auth.php" method="POST" id="authForm">
                <input type="hidden" name="action" id="authAction" value="cadastro">
                <input type="hidden" name="grupo" id="authGrupo" value="">
                <input type="hidden" name="convite" id="authConvite" value="">

                <script>
                    (function() {
                        const p = new URLSearchParams(window.location.search);
                        if (p.get('grupo')) document.getElementById('authGrupo').value = p.get('grupo');
                        if (p.get('convite')) document.getElementById('authConvite').value = p.get('convite');
                    })();
                </script>

                <div class="card-input">
                    <div class="input-group" id="group-nome">
                        <label for="nome"><i class="fa-solid fa-user"></i> NOME:</label>
                        <div class="input-with-icon">
                            <input type="text" id="nome" name="nome" placeholder="Seu nome completo" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="email"><i class="fa-solid fa-envelope"></i> EMAIL:</label>
                        <div class="input-with-icon">
                            <input type="email" id="email" name="email" required placeholder="seuemail@exemplo.com">
                        </div>
                    </div>

                    <div class="input-group" id="group-senha">
                        <label for="senha"><i class="fa-solid fa-lock"></i> SENHA:</label>
                        <div class="input-with-icon">
                            <input type="password" id="senha" name="senha" required placeholder="******">
                            <button type="button" class="toggle-password" onclick="togglePasswordVisibility('senha', this)">
                                <i class="fa-solid fa-eye"></i>
                            </button>
                        </div>
                        <div class="strength-bar-container" id="strength-container" style="display: none;">
                            <div id="strength-bar" class="strength-bar"></div>
                            <span id="strength-text" class="strength-text">Senha fraca</span>
                        </div>
                        
                        <div id="esqueceu-senha-container" style="display: none; text-align: right; margin-top: 8px;">
                            <a href="esqueceu_senha.php" style="color: #4d66f5; font-size: 0.85rem; text-decoration: none; font-family: 'Poppins', sans-serif; font-weight: 500; transition: color 0.3s;">
                                Esqueceu sua senha?
                            </a>
                        </div>
                    </div>

                    <div class="input-group" id="group-confirmar">
                        <label for="confirme_senha"><i class="fa-solid fa-shield-halved"></i> CONFIRME A SENHA:</label>
                        <div class="input-with-icon">
                            <input type="password" id="confirme_senha" name="confirme_senha" placeholder="******" required>
                            <button type="button" class="toggle-password" onclick="togglePasswordVisibility('confirme_senha', this)">

                        </div>
                    </div>

                <div id="password-requirements" class="password-requirements" style="display: block;"></div>

                <div class="buttons-group">
                    <button type="button" class="btn-auth secondary" id="btnModoLogin">LOGAR</button>
                    <button type="submit" class="btn-auth primary" id="btnSubmit">CADASTRAR-SE</button>
                </div>
            </form>

            <!-- Separador social -->
            <div class="social-divider">
                <span class="social-divider-line"></span>
                <span class="social-divider-text">ou</span>
                <span class="social-divider-line"></span>
            </div>

            <!-- Botão Entrar com Google -->
            <button id="btnGoogleLogin" class="btn-google" onclick="iniciarGoogleLogin()">
                <svg class="google-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
                    <path fill="#EA4335" d="M24 9.5c3.14 0 5.95 1.08 8.17 2.85l6.09-6.09C34.46 3.19 29.52 1 24 1 14.82 1 7.08 6.48 3.77 14.22l7.08 5.5C12.6 13.6 17.86 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                    <path fill="#FBBC05" d="M10.85 28.28A14.5 14.5 0 0 1 9.5 24c0-1.49.25-2.93.65-4.28l-7.08-5.5A23.93 23.93 0 0 0 0 24c0 3.77.9 7.34 2.46 10.54l8.39-6.26z"/>
                    <path fill="#34A853" d="M24 47c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.14 0-11.4-4.1-13.15-9.72l-8.39 6.26C7.08 41.52 14.82 47 24 47z"/>
                    <path fill="none" d="M0 0h48v48H0z"/>
                </svg>
                <span>Entrar com Google</span>
            </button>

            <!-- Container oculto do One Tap (não renderiza botão visível) -->
            <div id="g_id_onload"
                 data-client_id="111201670633-jful75g6i79jm1teb4fuqg28mrqjj284.apps.googleusercontent.com"
                 data-callback="handleGoogleCredential"
                 data-auto_prompt="false">
            </div>
        </div>

    </div>

    <script src="../assets/js/opus_alerta.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script>
        // ── Google Sign-In ────────────────────────────────────────
        const GOOGLE_CLIENT_ID = '111201670633-jful75g6i79jm1teb4fuqg28mrqjj284.apps.googleusercontent.com';
        let googleTokenClient = null;
        let googleSafetyTimeout = null;

        function resetarBtnGoogle() {
            if (googleSafetyTimeout) {
                clearTimeout(googleSafetyTimeout);
                googleSafetyTimeout = null;
            }
            const btn = document.getElementById('btnGoogleLogin');
            if (!btn) return;
            btn.disabled = false;
            btn.innerHTML = `
                <svg class="google-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
                    <path fill="#EA4335" d="M24 9.5c3.14 0 5.95 1.08 8.17 2.85l6.09-6.09C34.46 3.19 29.52 1 24 1 14.82 1 7.08 6.48 3.77 14.22l7.08 5.5C12.6 13.6 17.86 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                    <path fill="#FBBC05" d="M10.85 28.28A14.5 14.5 0 0 1 9.5 24c0-1.49.25-2.93.65-4.28l-7.08-5.5A23.93 23.93 0 0 0 0 24c0 3.77.9 7.34 2.46 10.54l8.39-6.26z"/>
                    <path fill="#34A853" d="M24 47c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.14 0-11.4-4.1-13.15-9.72l-8.39 6.26C7.08 41.52 14.82 47 24 47z"/>
                    <path fill="none" d="M0 0h48v48H0z"/>
                </svg>
                <span>Entrar com Google</span>`;
        }

        function enviarAutenticacaoBackend(dados) {
            fetch('../../back/google_callback.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dados),
            })
            .then(async (r) => {
                const text = await r.text();
                let data;
                try {
                    data = JSON.parse(text);
                } catch (e) {
                    console.error('Resposta não-JSON do servidor:', text);
                    if (text.includes('Erro de Conexão com o Banco de Dados') || text.includes('Erro no Banco de Dados')) {
                        throw new Error("O banco de dados 'opus' não foi encontrado no XAMPP. Importe o arquivo opus.sql no phpMyAdmin.");
                    }
                    throw new Error("Erro interno no servidor ao processar o login.");
                }
                return data;
            })
            .then(data => {
                resetarBtnGoogle();
                if (data.ok) {
                    localStorage.setItem('opus_cadastrado', 'true');
                    document.cookie = "opus_cadastrado=1; path=/; max-age=31536000";
                    window.location.href = data.redirect_url;
                } else {
                    opusAlerta({
                        tipo: 'error',
                        titulo: 'Erro no Google Sign-In',
                        mensagem: data.erro || 'Não foi possível autenticar sua conta Google. Tente novamente.'
                    });
                }
            })
            .catch(err => {
                resetarBtnGoogle();
                opusAlerta({
                    tipo: 'error',
                    titulo: 'Falha no Servidor',
                    mensagem: err.message || 'Não foi possível conectar ao servidor. Verifique se o Apache e o MySQL estão ativos no XAMPP.'
                });
            });
        }

        // Callback caso venha pelo One Tap (JWT id_token)
        function handleGoogleCredential(response) {
            if (!response || !response.credential) {
                resetarBtnGoogle();
                return;
            }
            enviarAutenticacaoBackend({ credential: response.credential });
        }

        function getGoogleTokenClient() {
            if (!googleTokenClient && window.google && google.accounts && google.accounts.oauth2) {
                googleTokenClient = google.accounts.oauth2.initTokenClient({
                    client_id: GOOGLE_CLIENT_ID,
                    scope: 'email profile openid',
                    callback: (tokenResponse) => {
                        if (tokenResponse.error) {
                            console.error('Google OAuth error:', tokenResponse);
                            resetarBtnGoogle();
                            let msg = 'Falha na autenticação do Google.';
                            if (tokenResponse.error === 'popup_closed_by_user') {
                                msg = 'A janela do Google foi fechada antes de concluir o login.';
                            } else if (tokenResponse.error === 'access_denied') {
                                msg = 'Acesso não autorizado ou cancelado.';
                            }
                            opusAlerta({
                                tipo: 'warning',
                                titulo: 'Login Cancelado',
                                mensagem: msg
                            });
                            return;
                        }
                        if (tokenResponse.access_token) {
                            enviarAutenticacaoBackend({ access_token: tokenResponse.access_token });
                        }
                    },
                    error_callback: (err) => {
                        console.error('Google token error:', err);
                        resetarBtnGoogle();
                        let msgErro = 'Não foi possível iniciar o login do Google.';
                        if (err && (err.type === 'origin_mismatch' || (err.message && err.message.includes('origin')))) {
                            msgErro = 'Origem não autorizada no Google Console. Acesse via http://localhost/OPUS ao invés de IP.';
                        }
                        opusAlerta({
                            tipo: 'error',
                            titulo: 'Erro do Google',
                            mensagem: msgErro
                        });
                    }
                });
            }
            return googleTokenClient;
        }

        function iniciarGoogleLogin() {
            // Verificação de URL/Origem (alerta se o usuário estiver usando 127.0.0.1 em vez de localhost)
            if (window.location.hostname === '127.0.0.1') {
                const urlAtual = window.location.href;
                const urlLocalhost = urlAtual.replace('127.0.0.1', 'localhost');
                opusAlerta({
                    tipo: 'info',
                    titulo: 'Dica de Conexão',
                    mensagem: 'O Google OAuth exige o endereço "localhost" em vez de "127.0.0.1". Redirecionando...',
                    botaoTexto: 'OK',
                    onConfirm: () => {
                        window.location.href = urlLocalhost;
                    }
                });
                setTimeout(() => { window.location.href = urlLocalhost; }, 2000);
                return;
            }

            const btn = document.getElementById('btnGoogleLogin');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i><span>Conectando...</span>';

            // Timeout de segurança: nunca deixa o botão travado em carregamento infinito
            if (googleSafetyTimeout) clearTimeout(googleSafetyTimeout);
            googleSafetyTimeout = setTimeout(() => {
                if (btn.disabled) {
                    resetarBtnGoogle();
                    opusAlerta({
                        tipo: 'warning',
                        titulo: 'Tempo Esgotado',
                        mensagem: 'O Google demorou para responder. Verifique se a janela pop-up não foi bloqueada pelo navegador ou se a rede da faculdade possui restrições.'
                    });
                }
            }, 15000);

            // Verifica se a biblioteca do Google carregou
            if (typeof google === 'undefined' || !google.accounts) {
                resetarBtnGoogle();
                opusAlerta({
                    tipo: 'error',
                    titulo: 'Google Indisponível',
                    mensagem: 'A biblioteca do Google não pôde ser carregada. Verifique sua conexão com a internet ou firewall da faculdade.'
                });
                return;
            }

            // Tenta fluxo popup moderno (OAuth 2.0 Token Client)
            try {
                const client = getGoogleTokenClient();
                if (client) {
                    client.requestAccessToken({ prompt: 'select_account' });
                    return;
                }
            } catch (err) {
                console.warn('OAuth token client falhou, tentando One Tap fallback:', err);
            }

            // Fallback: One Tap prompt
            try {
                google.accounts.id.initialize({
                    client_id: GOOGLE_CLIENT_ID,
                    callback: handleGoogleCredential,
                    ux_mode: 'popup',
                });
                google.accounts.id.prompt((notification) => {
                    if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
                        resetarBtnGoogle();
                    }
                });
            } catch (e) {
                console.error(e);
                resetarBtnGoogle();
            }
        }

        // Inicializa silenciosamente o One Tap caso o usuário já esteja logado no navegador
        window.addEventListener('load', function () {
            if (typeof google !== 'undefined' && google.accounts && google.accounts.id) {
                google.accounts.id.initialize({
                    client_id: GOOGLE_CLIENT_ID,
                    callback: handleGoogleCredential,
                    auto_select: false,
                });
            }
        });
    </script>
    <script>
        // Função do olhinho da senha
        function togglePasswordVisibility(inputId, button) {
            const input = document.getElementById(inputId);
            const icon = button.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        // Script inteligente que monitora se a tela está em "login" ou "cadastro"
        // e mostra/esconde o link de esquecer a senha automaticamente
        setInterval(function() {
            var acao = document.getElementById('authAction').value;
            var linkEsqueceu = document.getElementById('esqueceu-senha-container');
            
            if (acao === 'login') {
                linkEsqueceu.style.display = 'block'; // Mostra no Login
            } else {
                linkEsqueceu.style.display = 'none';  // Esconde no Cadastro
            }
        }, 100);
    </script>
</body>
