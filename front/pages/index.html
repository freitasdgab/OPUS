<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bem-vindo ao Opus</title>

    <script>
        // Inteligência para reconhecer usuário já cadastrado e pular apresentação
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            const skipRedirect = urlParams.get('redirect') === 'false';

            if (!skipRedirect) {
                const foiCadastrado = localStorage.getItem('opus_cadastrado') === 'true' || 
                                      document.cookie.split(';').some(item => item.trim().startsWith('opus_cadastrado='));
                if (foiCadastrado) {
                    window.location.href = 'auth.html?mode=login';
                }
            }
        })();
    </script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="../assets/img/logo.png">
    <link rel="shortcut icon" href="../assets/img/logo.png">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

    <!-- TOP BAR DE NAVEGAÇÃO -->
    <header class="topbar">
        <a href="index.html?redirect=false" class="topbar-brand">
            <img src="../assets/img/logo.png" alt="Logo Opus" class="topbar-logo">
            <span class="topbar-title">OPUS</span>
        </a>
        <div class="topbar-actions">
            <a href="auth.html?mode=login" class="topbar-btn btn-login">ENTRAR</a>
            <a href="auth.html?mode=cadastro" class="topbar-btn btn-signup">CADASTRAR-SE</a>
        </div>
    </header>

    <canvas id="bg-canvas"></canvas>

    <div class="wrapper">
        <div class="left-side">
            <img src="../assets/img/mundo.png" alt="Mascotes do Opus" class="mascots-img">
        </div>

        <div class="right-side">
            <h1 class="title">
                Bem-vindo<br>ao<br><span class="brand">Opus</span>
            </h1>
            <p class="description">
                o site onde você aprende programação de forma simples, interativa e divertida.
            </p>
            
            <a href="auth.html?mode=cadastro" class="btn-start" id="btnComecar">COMEÇAR</a>
        </div>
    </div>

    <script src="../assets/js/script.js"></script>
</body>
</html>
