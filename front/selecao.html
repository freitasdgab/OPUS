<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicie sua Jornada Java - Opus</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="selecao.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="modal-overlay" id="modalConfirmacao">
        <div class="modal-card">
            <div class="modal-icon">
                <i class="fas fa-code"></i>
            </div>
            <h3>INICIAR JORNADA JAVA?</h3>
            <p>Você está prestes a começar seus estudos na linguagem que move o mundo. Vamos nessa?</p>
            <div class="modal-buttons">
                <button class="btn-modal cancel" onclick="fecharModal()">MAIS TARDE</button>
                <button class="btn-modal confirm" id="btnConfirmarFinal">VAMOS COMECAR!</button>
            </div>
        </div>
    </div>

    <div class="main-wrapper">
        <div class="content-container">
            <div class="opi-column">
                <img src="opi_graduado.png" alt="Opi Graduado" class="opi-img">
            </div>

            <div class="selection-column">
                <h2 class="title-tech">
                    PARA A GENTE CONTINUAR APRENDENDO, VAMOS MERGULHAR NO MUNDO <span class="highlight">JAVA</span> E COMEÇAR NOSSA JORNADA AGORA!
                </h2>

                <div class="focused-selection">
                    <div class="lang-card single-focus" onclick="abrirModal('Java')">
                        <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/java/java-original.svg" alt="Java Logo">
                        <span>JAVA CORE</span>
                    </div>
                    
                    <p class="hint">Clique na logo para confirmar o início</p>
                </div>
            </div>
        </div>
    </div>

    <script src="selecao.js"></script>
</body>
</html>
